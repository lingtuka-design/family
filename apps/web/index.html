<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>"
    />
    <title>Family Storybook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Self-healing: if the app's JS bundle fails to load (e.g. a stale
         cached index.html referencing a bundle removed by a newer deploy),
         reload once to fetch the fresh page. */
      window.addEventListener(
        "error",
        function (e) {
          if (
            e.target &&
            e.target.tagName === "SCRIPT" &&
            !window.__familyStorybookReloaded
          ) {
            window.__familyStorybookReloaded = true;
            window.location.reload();
          }
        },
        true
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
