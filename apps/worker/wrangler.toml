name = "family-storybook-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# ==== D1 database ====
# Create it first:
#   wrangler d1 create family-storybook
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "family-storybook"
database_id = "a56f746b-bda6-4fb4-bfef-d09e6a7ea3e6"

# ==== R2 bucket ====
# Create it first:
#   wrangler r2 bucket create family-storybook-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "family-storybook-images"

# ==== Optional: protect the write API ====
# Set the secret instead of putting it in this file:
#   wrangler secret put ADMIN_TOKEN
# If set, POST /api/pages requires the "x-admin-token" request header.
# (The /admin UI itself is protected by Cloudflare Zero Trust / Access.)
